name: Refresh BEY contribution art

on:
  schedule:
    - cron: '17 6 * * *' # 09:17 Europe/Istanbul
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update_contributions.py'
      - '.github/workflows/update-profile.yml'

permissions:
  contents: write

concurrency:
  group: bey-profile-art
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Fetch and validate the public calendar
        run: python scripts/update_contributions.py
      - name: Commit changed art
        shell: bash
        run: |
          git add data/contributions.json assets/contributions.svg
          if git diff --cached --quiet; then
            echo "Contribution art is already current."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore: refresh BEY contribution art"
          git push
